<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- window body -->
  <rect x="2" y="2" width="696" height="296" rx="14" fill="#0a192f" stroke="#24304a" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M2 16 Q2 2 16 2 H684 Q698 2 698 16 V40 H2 Z" fill="#0d1f3c"/>
  <line x1="2" y1="40" x2="698" y2="40" stroke="#24304a" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="6" fill="#27c93f"/>

  <!-- window title -->
  <text x="350" y="25" text-anchor="middle" font-family="Consolas, Menlo, Monaco, 'Courier New', monospace" font-size="12" fill="#8892b0">ymax@localhost: ~</text>

  <!-- body text -->
  <g font-family="Consolas, Menlo, Monaco, 'Courier New', monospace" font-size="14.5">
    <text x="24" y="70"><tspan fill="#64FFDA">$ </tspan><tspan fill="#e6f1ff">whoami</tspan></text>
    <text x="24" y="94" fill="#8892b0">&gt; ymax — backend-leaning full-stack dev</text>

    <text x="24" y="130"><tspan fill="#64FFDA">$ </tspan><tspan fill="#e6f1ff">cat mission.txt</tspan></text>
    <text x="24" y="154" fill="#8892b0">&gt; I turn messy problems into clean, maintainable code.</text>
    <text x="24" y="176" fill="#8892b0">&gt; Python first. JS when the browser demands it.</text>

    <text x="24" y="212"><tspan fill="#64FFDA">$ </tspan><tspan fill="#e6f1ff">ls currently/</tspan></text>
    <text x="24" y="236" fill="#8892b0">&gt; shipping/   learning/   breaking-things/   fixing-them/</text>

    <text x="24" y="272"><tspan fill="#64FFDA">$ </tspan><tspan fill="#e6f1ff"> </tspan></text>
    <rect x="40" y="260" width="9" height="16" fill="#64FFDA">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
